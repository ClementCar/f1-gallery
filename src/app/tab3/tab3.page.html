<ion-content class="page-content" [fullscreen]="true">
  <ion-row>
    @for (driver of drivers; track driver.name) {
        <ion-col size="4">
          <ion-card>
              <ion-card-header>
                <ion-card-title>{{ driver.name }} {{ driver.lastname }}</ion-card-title>
              </ion-card-header>
            </ion-card>
            <img [src]="'/assets/drivers/' + getText(driver.lastname) + '.avif'" alt="">
        </ion-col>
      }
  </ion-row>
</ion-content>
