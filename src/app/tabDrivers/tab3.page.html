<ion-content class="page-content" [fullscreen]="true">

  <ion-row class="ion-padding">
      @for (driver of drivers; track driver.name) {
          <ion-col size="12" sizeSm="6" sizeMd="4" sizeLg="3">
            <app-driver-card [driver]="driver" (select)="selectDriver($event)"></app-driver-card>
          </ion-col>
        }
  </ion-row>
</ion-content>
