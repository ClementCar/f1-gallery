<ion-content class="page-content" [fullscreen]="true">
  <ion-row>
    @for (team of teams; track team.name) {
      <ion-col size="4">
        <ion-card>
          <ion-card-header>
            <ion-card-title>{{ team.name }}</ion-card-title>
          </ion-card-header>
        </ion-card>
      </ion-col>
    }
  </ion-row>
</ion-content>
