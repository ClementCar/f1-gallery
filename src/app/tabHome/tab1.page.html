<ion-content class="page-content" [fullscreen]="true">
  <video src="/assets/bg-animated-3.mp4" #bgVideo></video>
  <section class="flex-column-center w-100 h-100">
    <h1>{{ 'HOME.TITLE' | translate }}</h1>

    <ion-buttons>
      <ion-button routerLink="/teams" >{{ 'HOME.TEAMS' | translate }}</ion-button>
      <ion-button routerLink="/drivers" >{{ 'HOME.DRIVERS' | translate }}</ion-button>
    </ion-buttons>
    
    <ion-button class="btn-sound" color="white" fill="clear" (click)="changeVolume()">
      <ion-icon [name]="muted ? 'volume-mute-outline' : 'volume-high-outline' "></ion-icon>
    </ion-button>
  </section>

</ion-content>
