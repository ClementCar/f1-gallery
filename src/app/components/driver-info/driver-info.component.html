<ion-content class="page-content" [fullscreen]="true">
  <div class="w-100 h-100 bgContainer" #bgContainer></div>
  @if (current) {
    <ion-row class="h-100" [style.--base]="current.team.color" [style.--light]="lightenDarkenColor(current.team.color, 40)" 
            [style.--dark]="lightenDarkenColor(current.team.color, -40)">
      <ion-col size="4" class="flex-column ion-justify-content-center">
        <div class="driver-title">
          <h2 class="name windsong-regular">{{ current.driver.name }}</h2>
          <h2 class="surname exo-2-500">{{ current.driver.lastname }}</h2>
        </div>

        <p class="ion-margin-top">{{current.team.name}}</p>

        <div class="ion-margin-top driver-bio">
          <p>BIO</p>
          <p>testestesteststeestsetestte</p>
        </div>
      </ion-col>
      <ion-col size="4" class="col-img">
        <!-- <div class="col-img__driver">
          <img [src]="'/assets/drivers/' + getLower(current.driver.lastname) + '/picture.avif'" alt="">
        </div> -->
        <img [src]="'/assets/drivers/' + getLower(current.driver.lastname) + '/picture.avif'" alt="">
      </ion-col>
      <ion-col size="4" class="flex-column ion-justify-content-end">
        <img class="number" [src]="'/assets/drivers/' + getLower(current.driver.lastname) + '/number.avif'" alt="">
        <ion-item-group class="w-100">
          <ion-item-divider>
            Stat
          </ion-item-divider>

          <ion-item>
            <ion-label>Gp entered</ion-label>
            <ion-note>27</ion-note>
          </ion-item>
          <ion-item>
            <ion-label>Gp entered</ion-label>
            <ion-note>27</ion-note>
          </ion-item>
          <ion-item>
            <ion-label>Career points</ion-label>
            <ion-note>1000</ion-note>
          </ion-item>
          <ion-item>
            <ion-label>highest race finish</ion-label>
            <ion-note>1</ion-note>
          </ion-item>
          <ion-item>
            <ion-label>Pole position</ion-label>
            <ion-note>2</ion-note>
          </ion-item>
          <ion-item>
            <ion-label>worlds chammpionship</ion-label>
            <ion-note>0</ion-note>
          </ion-item>
        </ion-item-group>
      </ion-col>
    </ion-row>
  }
</ion-content>
